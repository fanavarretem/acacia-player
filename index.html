
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="video">
    <iframe
      src="https://www.youtube.com/embed/HAeSkQH1C-I?list=PLeySRPnY35dGfEuNGbQmymhiQF4oTUIMb"
      title="Funciones por tramos y racionalización"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      autoplay=1
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
